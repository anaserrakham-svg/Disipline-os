<div class="card"><h2>${L('today')}</h2>${is.map(x=>item(x,t)).join('')||`<div class="mut">${L('empty')}</div>`}</div>`}
function listHTML(){const s=U.sel;let a,b;if(U.scope=='day')a=b=s;else if(U.scope=='week'){a=mon(s);b=add(a,6)}else{a=s.slice(0,8)+'01';const d=pd(a);d.setMonth(d.getMonth()+1);b=add(ymd(d),-1)}
let h='';for(let d=a;d<=b;d=add(d,1)){const r=inst(d).filter(t=>(!U.q||t.title.toLowerCase().includes(U.q.toLowerCase()))&&(!U.cat||t.cat==U.cat)&&(!U.pr||t.prio==U.pr)&&(U.st==''||(U.st=='d')==!!ent(t,d)));if(r.length)h+=`${U.scope!='day'?`<div class="mut" style="margin:10px 0 6px">${fmt(d,{weekday:'short',day:'numeric',month:'short'})}</div>`:''}${r.map(t=>item(t,d)).join('')}`}
return h||`<div class="mut" style="padding:16px;text-align:center">${L('empty')}</div>`}
const opts=(a,f)=>a.map(x=>`<option value="${x}">${f(x)}</option>`).join('');
function tasks(){return`<div class="seg">${['day','week','month'].map(x=>`<button class="${U.scope==x?'on':''}" data-a="scope" data-s="${x}">${L(x)}</button>`).join('')}</div>
<div class="row sp" style="margin-bottom:10px"><button class="btn s" style="flex:none" data-a="prev">‹</button><b class="or" style="text-align:center;font-size:13px">${U.scope=='month'?fmt(U.sel,{month:'long',year:'numeric'}):U.scope=='week'?fmt(mon(U.sel),{day:'numeric',month:'short'})+' → '+fmt(add(mon(U.sel),6),{day:'numeric',month:'short'}):fmt(U.sel,{weekday:'short',day:'numeric',month:'short'})}</b><button class="btn s" style="flex:none" data-a="next">›</button></div>
<input id="q" placeholder="🔎 ${L('search')}" value="${esc(U.q)}"><div class="row"><select id="fc"><option value="">${L('all')}</option>${opts(Object.keys(CATS),k=>CATS[k]+' '+L('c_'+k))}</select><select id="fs"><option value="">${L('all')}</option><option value="p">${L('pending')}</option><option value="d">${L('completed')}</option></select><select id="fp"><option value="">${L('prio')}</option>${opts([1,2,3],k=>L('p'+k))}</select></div>
<div id="lst" style="margin-top:8px">${listHTML()}</div><button class="btn fab" data-a="add">+</button>`}
function modal(id){const t=S.tasks.find(x=>x.id==id)||{title:'',cat:'edu',sub:'',prio:2,date:U.sel,repeat:'none',time:'',remind:0,mins:0};
$('#ov').innerHTML=`<div class="ov"><div class="md" data-id="${id||''}"><h2>${id?L('edit'):L('add')}</h2><label>${L('title')}</label><input id="f-t" value="${esc(t.title)}"><div class="row"><div><label>${L('cat')}</label><select id="f-c">${opts(Object.keys(CATS),k=>CATS[k]+' '+L('c_'+k))}</select></div><div><label>${L('sub')}</label><select id="f-s"></select></div></div>
<div class="row"><div><label>${L('prio')}</label><select id="f-p">${opts([1,2,3],k=>L('p'+k))}</select></div><div><label>${L('dur')}</label><input id="f-m" type="number" min="0" value="${t.mins||''}"></div></div>
<div class="row"><div><label>${L('date')}</label><input id="f-d" type="date" value="${t.date}"></div><div><label>${L('repeat')}</label><select id="f-r">${opts(['none','daily','weekly'],k=>L('r_'+k))}</select></div></div>
<div class="row"><div><label>${L('time')}</label><input id="f-h" type="time" value="${t.time}"></div><div><label>${L('remind')}</label><select id="f-n"><option value="0">${L('none')}</option>${[5,15,30,60].map(m=>`<option value="${m}">${m} ${L('min')}</option>`).join('')}</select></div></div>
<div class="row" style="margin-top:8px"><button class="btn s" data-a="close">${L('cancel')}</button><button class="btn" data-a="savet">${L('save')}</button></div></div></div>`;
$('#f-c').value=t.cat;$('#f-p').value=t.prio;$('#f-r').value=t.repeat;$('#f-n').value=t.remind;const fs=()=>{$('#f-s').innerHTML='<option value="">—</option>'+opts(SUBS[$('#f-c').value],k=>L('s_'+k))};fs();$('#f-s').value=t.sub;$('#f-c').onchange=fs}
function cal(){const[y,m]=U.cm.split('-').map(Number),f=y+'-'+String(m).padStart(2,'0')+'-01',off=(pd(f).getDay()+6)%7,n=new Date(y,m,0).getDate(),dn=['1','2','3','4','5','6','7'].map((_,i)=>fmt('2024-01-0'+(i+1),{weekday:'narrow'}));
let g=dn.map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(off);for(let i=1;i<=n;i++){const d=f.slice(0,8)+String(i).padStart(2,'0'),c=cnt(d,d),a=Math.min(.6,c*.15);g+=`<div data-a="cd" data-d="${d}" class="${d==U.sel?'sel':''} ${d==TD()?'td':''}" style="background:rgba(25,227,255,${a})">${i}</div>`}
return`<div class="card"><div class="row sp" style="margin-bottom:10px"><button class="btn s" style="flex:none" data-a="cp">‹</button><b class="or" style="text-align:center;font-size:13px">${fmt(f,{month:'long',year:'numeric'})}</b><button class="btn s" style="flex:none" data-a="cn">›</button></div><div class="cal">${g}</div></div>
<div class="card"><h2>${fmt(U.sel,{weekday:'long',day:'numeric',month:'long'})}</h2>${inst(U.sel).map(t=>item(t,U.sel)).join('')||`<div class="mut">${L('empty')}</div>`}<div class="row" style="margin-top:8px"><button class="btn s" data-a="goto">${L('open')}</button><button class="btn ${U.arm=='r'?'d':'s'}" data-a="rd">${U.arm=='r'?L('resetn'):L('reset')}</button></div></div>`}
function stats(){const t=TD();let bk=[],a,r=U.rng;if(r=='d')for(let i=13;i>=0;i--){const d=add(t,-i);bk.push([fmt(d,{day:'numeric'}),d,d])}else if(r=='w')for(let i=7;i>=0;i--){const s=add(mon(t),-7*i);bk.push([fmt(s,{day:'numeric',month:'numeric'}),s,add(s,6)])}else for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const s=ymd(d);d.setMonth(d.getMonth()+1);bk.push([fmt(s,{month:'short'}),s,add(ymd(d),-1)])}
const v=bk.map(x=>cnt(x[1],x[2])),mx=Math.max(1,...v),A=bk[0][1],B=bk[bk.length-1][2],inr=l=>l.date>=A&&l.date<=B,sl=S.log.filter(inr),[cn,cs]=sched(A,B);
const bars=bk.map((x,i)=>{const w=300/bk.length,h=v[i]/mx*100;return`<rect x="${i*w+4}" y="${115-h}" width="${w-8}" height="${h}" rx="4" fill="url(#g2)"/><text x="${i*w+w/2}" y="${112-h}" fill="#dce8ff" font-size="9" text-anchor="middle">${v[i]||''}</text><text x="${i*w+w/2}" y="130" fill="#7d90ba" font-size="9" text-anchor="middle">${x[0]}</text>`}).join('');
const cats=Object.keys(CATS).map(k=>[k,sl.filter(l=>l.cat==k).length]);
return`<div class="seg">${['d','w','m'].map(x=>`<button class="${r==x?'on':''}" data-a="rng" data-r="${x}">${L('rng_'+x)}</button>`).join('')}</div>
<div class="card"><svg viewBox="0 0 300 135" width="100%"><defs><linearGradient id="g2" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#2f7bff"/><stop offset="1" stop-color="#19e3ff"/></linearGradient></defs>${bars}</svg></div>
<div class="g"><div class="card"><h2>${L('done')}</h2><div class="big">${sl.length}</div></div><div class="card"><h2>${L('study')}</h2><div class="big">${(sl.filter(l=>l.cat=='edu').reduce((a,l)=>a+l.mins,0)/60).toFixed(1)}</div></div><div class="card"><h2>${L('ex')}</h2><div class="big">${sl.filter(l=>l.cat=='fit').length}</div></div><div class="card"><h2>${L('cons')}</h2><div class="big">${cs?Math.round(cn/cs*100):0}%</div></div></div>
<div class="card"><h2>${L('cat')}</h2>${cats.map(([k,n])=>`<div class="row sp" style="margin-bottom:6px"><span style="flex:1.4">${CATS[k]} ${L('c_'+k)}</span><div class="bar" style="flex:2"><i style="width:${n/Math.max(1,sl.length)*100}%"></i></div><b style="flex:.4;text-align:end">${n}</b></div>`).join('')}<div class="mut">🍳 ${L('meals')}: ${S.log.filter(l=>l.cat=='cook').length}</div></div>
<div class="card"><h2>${L('hist')}</h2>${[...dates()].sort().reverse().slice(0,14).map(d=>`<div class="row sp mut"><span>${fmt(d,{weekday:'short',day:'numeric',month:'short'})}</span><b style="text-align:end">${cnt(d,d)} ✓</b></div>`).join('')||'—'}<div class="mut" style="margin-top:6px">🗄 ${new Set(S.archive.map(x=>x.date)).size} ${L('arch')}</div></div><button class="btn" style="width:100%" data-a="export">⬇ ${L('exp')}</button>`}
function fin(){const m=TD().slice(0,7),I=x=>S.fin.filter(f=>f.type==x&&(x!=='m'||1)),sum=(x,mm)=>S.fin.filter(f=>f.type==x&&(!mm||f.date.startsWith(mm))).reduce((a,f)=>a+f.amt,0),bal=sum('inc')-sum('exp');
return`<div class="g"><div class="card"><h2>${L('inc')} · ${L('ths')}</h2><div class="big" style="color:var(--ok)">${sum('inc',m).toFixed(0)}</div></div><div class="card"><h2>${L('expn')} · ${L('ths')}</h2><div class="big" style="color:#ff6b8f">${sum('exp',m).toFixed(0)}</div></div></div>
<div class="card"><h2>${L('goal')}</h2><div class="row"><input id="gl" type="number" value="${S.goal||''}" placeholder="0"><button class="btn s" data-a="goal" style="flex:none">OK</button></div><div class="mut">${L('bal')}: ${bal.toFixed(0)}${S.goal?' / '+S.goal:''}</div><div class="bar"><i style="width:${S.goal?Math.max(0,Math.min(100,bal/S.goal*100)):0}%"></i></div></div>
<div class="card"><div class="row"><select id="ft"><option value="inc">${L('inc')}</option><option value="exp">${L('expn')}</option></select><input id="fa" type="number" min="0" step="any" placeholder="${L('amt')}"></div><input id="fn" placeholder="${L('note')}"><button class="btn" style="width:100%" data-a="fadd">+</button></div>
<div class="card">${S.fin.slice().reverse().slice(0,30).map(f=>`<div class="row sp" style="padding:6px 0"><span class="mut" style="flex:1">${fmt(f.date,{day:'numeric',month:'short'})}</span><span style="flex:2">${esc(f.note)}</span><b style="flex:1;text-align:end;color:${f.type=='inc'?'var(--ok)':'#ff6b8f'}">${f.type=='inc'?'+':'−'}${f.amt}</b><button class="ic" style="flex:none" data-a="fdel" data-i="${f.id}">✕</button></div>`).join('')||`<div class="mut">${L('empty')}</div>`}</div>`}
function aw(){const b=badges();return`<div class="card"><h2>🏆 ${b.filter(x=>x.u).length}/${b.length}</h2>${b.map(x=>`<div class="bd ${x.u?'u':''}"><span class="e">${x.e}</span><b>${x.n}</b></div>`).join('')}</div>`}
const VIEWS={home,tasks,cal,stats,fin,aw},ICO={home:'⌂',tasks:'☑',cal:'▦',stats:'▤',fin:'◈',aw:'✦'};
function R(){document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';$('#lb').textContent=S.lang=='ar'?'FR':'عربي';
$('#nv').innerHTML=Object.keys(VIEWS).map(k=>`<button class="${U.v==k?'on':''}" data-a="nav" data-v="${k}"><span>${ICO[k]}</span>${L(k)}</button>`).join('');
$('#m').innerHTML=VIEWS[U.v]();$('#m').style.animation='none';void $('#m').offsetWidth;$('#m').style.animation='';
if(U.v=='tasks'){$('#fc').value=U.cat;$('#fs').value=U.st;$('#fp').value=U.pr}}
function report(){const t=TD(),[c,b]=streaks(),xp=totalXP();let s=`DISCIPLINE OS — ${t}\nStop imagining. Start becoming.\n\n${L('lvl')}: ${lvl(xp)} (${xp} XP)\n${L('streak')}: ${c} / ${L('best')}: ${b}\n${L('done')}: ${S.log.length}\n${L('study')}: ${(S.log.filter(l=>l.cat=='edu').reduce((a,l)=>a+l.mins,0)/60).toFixed(1)}\n${L('ex')}: ${S.log.filter(l=>l.cat=='fit').length}\n\n`;
[...dates()].sort().reverse().slice(0,30).forEach(d=>{s+=d+': '+S.log.filter(l=>l.date==d).map(l=>l.title).join(', ')+'\n'});return s}
function csv(txt){const ta=$('#ex');ta.select();try{navigator.clipboard.writeText(txt)}catch(e){document.execCommand('copy')}toast(L('copied'))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,d=el.dataset;
if(a=='nav'){U.v=d.v;U.arm='';R()}else if(a=='lang'){S.lang=S.lang=='ar'?'fr':'ar';save();R()}
else if(a=='tog'){toggle(d.t,d.d);R()}else if(a=='add')modal();else if(a=='edit')modal(d.t);else if(a=='close')$('#ov').innerHTML='';
else if(a=='del'){if(U.arm=='t'+d.t){S.tasks=S.tasks.filter(x=>x.id!=d.t);U.arm='';save()}else U.arm='t'+d.t;R()}
else if(a=='savet'){const id=$('.md').dataset.id,v=i=>$(i).value,o={title:v('#f-t').trim(),cat:v('#f-c'),sub:v('#f-s'),prio:+v('#f-p'),date:v('#f-d')||TD(),repeat:v('#f-r'),time:v('#f-h'),remind:+v('#f-n'),mins:+v('#f-m')||0};if(!o.title){$('#f-t').focus();return}
if(id)Object.assign(S.tasks.find(x=>x.id==id),o);else S.tasks.push({id:uid(),...o});save();$('#ov').innerHTML='';R()}
else if(a=='scope'){U.scope=d.s;R()}else if(a=='prev'||a=='next'){const k=a=='next'?1:-1;if(U.scope=='day')U.sel=add(U.sel,k);else if(U.scope=='week')U.sel=add(U.sel,7*k);else{const x=pd(U.sel);x.setDate(1);x.setMonth(x.getMonth()+k);U.sel=ymd(x)}R()}
else if(a=='claim'){S.claimed[d.k]=+d.x;save();toast('+'+d.x+' '+L('xp'));R()}
else if(a=='cd'){U.sel=d.d;R()}else if(a=='cp'||a=='cn'){const[y,m]=U.cm.split('-').map(Number),x=new Date(y,m-1+(a=='cn'?1:-1),1);U.cm=ymd(x).slice(0,7);R()}
else if(a=='goto'){U.v='tasks';U.scope='day';R()}
else if(a=='rd'){if(U.arm=='r'){const ds=S.log.filter(l=>l.date==U.sel);S.archive.push(...ds.map(l=>({...l,resetAt:Date.now()})));S.log=S.log.filter(l=>l.date!=U.sel);U.arm='';save()}else U.arm='r';R()}
else if(a=='rng'){U.rng=d.r;R()}
else if(a=='goal'){S.goal=+$('#gl').value||0;save();R()}
else if(a=='fadd'){const n=+$('#fa').value;if(n>0){S.fin.push({id:uid(),type:$('#ft').value,amt:n,note:$('#fn').value,date:TD()});save();R()}}
else if(a=='fdel'){S.fin=S.fin.filter(f=>f.id!=d.i);save();R()}
else if(a=='export'){$('#ov').innerHTML=`<div class="ov"><div class="md"><h2>${L('exp')}</h2><textarea id="ex" readonly>${esc(report())}</textarea><div class="row" style="margin-top:8px"><button class="btn s" data-a="close">${L('cancel')}</button><button class="btn s" data-a="cj">JSON</button><button class="btn" data-a="cc">${L('copy')}</button><button class="btn s" data-a="dl">⬇</button></div></div></div>`}
else if(a=='cc')csv($('#ex').value);else if(a=='cj'){$('#ex').value=JSON.stringify(S,null,1);csv($('#ex').value)}
else if(a=='dl'){try{const u=URL.createObjectURL(new Blob([$('#ex').value],{type:'text/plain'})),l=document.createElement('a');l.href=u;l.download='discipline-os-report.txt';l.click()}catch(x){}csv($('#ex').value)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){U.q=e.target.value;$('#lst').innerHTML=listHTML()}});
document.addEventListener('change',e=>{const m={fc:'cat',fs:'st',fp:'pr'}[e.target.id];if(m){U[m]=e.target.value;$('#lst').innerHTML=listHTML()}});
const fired=new Set();setInterval(()=>{const n=new Date(),t=TD(),hm=n.getHours()*60+n.getMinutes();inst(t).forEach(x=>{if(!x.time||!x.remind||ent(x,t)||fired.has(x.id+t))return;const[h,m]=x.time.split(':').map(Number);if(hm>=h*60+m-x.remind&&hm<=h*60+m+60){fired.add(x.id+t);toast('⏰ '+L('rem')+': '+x.title);try{if(Notification.permission=='granted')new Notification(x.title)}catch(e){}}})},30000);
try{if(Notification.permission=='default')document.addEventListener('click',()=>Notification.requestPermission(),{once:true})}catch(e){}
R();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
